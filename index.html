<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnemFlow — Organizador de Estudos ENEM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdfb;--bg2:#f6f3ff;--tx:#2b2a35;--mu:#75738a;--bd:#ebe8f5;--sh:0 4px 18px rgba(124,77,255,.09);--g:linear-gradient(135deg,#7C4DFF,#FF2D78 60%,#FF8A00);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141c;--bg2:#211f2d;--tx:#f0eefa;--mu:#a09eb5;--bd:#322f45;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#15141c;--bg2:#211f2d;--tx:#f0eefa;--mu:#a09eb5;--bd:#322f45;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.28;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body::before{background:#FF2D78;top:-90px;left:-90px}body::after{background:#00C2A8;bottom:-90px;right:-90px;animation-delay:-6s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.2)}}
.w{max-width:940px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;margin:0}
.logo-txt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}}
h2{font-size:24px;font-weight:800;margin:14px 0 4px}h3{font-size:15px;margin:0;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.xp{min-width:150px;text-align:right;font-size:12px;font-weight:700}
.xp .prog{margin:3px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding:4px 2px 8px}
nav button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:transform .2s,box-shadow .2s}
nav button:hover{transform:translateY(-2px);box-shadow:var(--sh)}
nav button.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,45,120,.3)}
.card{border:1px solid var(--bd);border-radius:16px;padding:14px;background:var(--bg);margin-bottom:12px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px)}
.stat{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--bg)),var(--bg));border-color:color-mix(in srgb,var(--c) 40%,var(--bd))}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:10px;transition:background .2s}
.row:hover{background:var(--bg2)}
.row.d span.t{text-decoration:line-through;color:var(--mu)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap}
.bar{border-left:5px solid var(--c)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:7px 10px;max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:#7C4DFF;box-shadow:0 0 0 3px rgba(124,77,255,.18)}
input[type=checkbox]{accent-color:var(--c,#7C4DFF);width:18px;height:18px;cursor:pointer;transition:transform .2s}
input[type=checkbox]:active{transform:scale(1.5)}
.btn{border:0;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 18px rgba(255,45,120,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:7px 0}
.prog i{display:block;height:100%;background:var(--c,#7C4DFF);border-radius:6px;transition:width .6s}
.anim .prog i{animation:gr .9s cubic-bezier(.2,.8,.2,1);transform-origin:left}
@keyframes gr{from{transform:scaleX(0)}}
.big{font-size:32px;font-weight:800;line-height:1.1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{font-size:12px;color:var(--mu);text-align:center}
.cal div.c{min-height:50px;border:1px solid var(--bd);border-radius:10px;padding:3px 5px;font-size:12px;cursor:pointer;transition:transform .15s,background .2s}
.cal div.c:hover{transform:scale(1.07);background:var(--bg2)}
.cal div.c.t{border:2px solid #FF2D78}.cal div.c.s{background:var(--bg2);outline:2px solid #7C4DFF}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip{cursor:pointer;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:3px 11px;font:inherit;font-size:13px;font-weight:600;transition:all .2s;text-decoration:none;display:inline-block}
.chip:hover{border-color:#7C4DFF;transform:translateY(-1px)}
.chip.on{background:#7C4DFF;color:#fff;border-color:#7C4DFF}
.wk{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.wk .tag{display:block;margin-bottom:4px;white-space:normal}
label{display:block;font-weight:600;margin:12px 0 4px}
.lk{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 4px;animation:op .3s}
@keyframes op{from{opacity:0;transform:translateY(-6px)}}
.anim>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.12s}.anim>*:nth-child(4){animation-delay:.18s}.anim>*:nth-child(n+5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1><span class="logo-ico">📚</span> <span class="logo-txt">EnemFlow</span></h1><div class="xp" id="xp"></div></header>
 <nav id="nav"></nav>
<main id="app"></main>
</div>
<script>
var A=[
{id:'lc',c:'#FF2D78',n:'Linguagens e suas Tecnologias',d:'BNCC · LGG — uso crítico de linguagens, diversidade e tecnologias digitais.',s:[
['port','Português','#FF2D78',['Interpretação de texto|1','Gêneros textuais|1','Variação linguística|2','Funções da linguagem|1']],
['lit','Literatura e Artes','#E040FB',['Escolas literárias|6','Modernismo brasileiro|6','Artes e cultura|3','Intertextualidade|1']],
['ing','Inglês / Espanhol','#FF6A3D',['Interpretação em língua estrangeira|4','Vocabulário em contexto|4','Gêneros digitais|7']],
['red','Redação','#00A3FF',['Estrutura dissertativa|1','As 5 competências do ENEM|1','Proposta de intervenção|1','Repertório sociocultural|1']]]},
{id:'mt',c:'#FF8A00',n:'Matemática e suas Tecnologias',d:'BNCC · MAT — modelar, resolver problemas e investigar com registros variados.',s:[
['mat1','Matemática: Fundamentos','#FF8A00',['Razão, proporção e escala|1','Porcentagem e juros|1','Estatística e gráficos|2','Unidades e medidas|3']],
['mat2','Matemática: Funções e Geometria','#F5B800',['Função afim e quadrática|4','Exponencial e logaritmo|4','Geometria plana e espacial|3','Análise combinatória e probabilidade|5']]]},
{id:'cn',c:'#00C2A8',n:'Ciências da Natureza e suas Tecnologias',d:'BNCC · CNT — matéria e energia; vida, Terra e cosmos; investigação científica.',s:[
['fis','Física','#00C2A8',['Cinemática e dinâmica|1','Energia e trabalho|1','Eletricidade|1','Ondulatória e óptica|1']],
['qui','Química','#76D100',['Estequiometria|1','Química orgânica|1','Soluções e equilíbrio|1','Termoquímica|1']],
['bio','Biologia','#00A650',['Ecologia|3','Genética|2','Citologia|2','Evolução|2']]]},
{id:'ch',c:'#7C4DFF',n:'Ciências Humanas e Sociais Aplicadas',d:'BNCC · CHS — processos históricos, territórios, natureza, trabalho e cidadania.',s:[
['his','História','#7C4DFF',['Brasil Colônia e Império|1','República brasileira|1','Guerras mundiais e Guerra Fria|1','Ditadura e redemocratização|5']],
['geo','Geografia','#B14DFF',['Cartografia e territórios|2','Meio ambiente e clima|3','Urbanização e demografia|2','Geopolítica|1']],
['fil','Filosofia e Sociologia','#4D6BFF',['Ética e política|6','Cultura e desigualdade|5','Trabalho e sociedade|4','Cidadania e direitos|6']]]}];
var S=[],AN={};A.forEach(function(a){AN[a.id]=a;a.s.forEach(function(s){S.push({id:s[0],n:s[1],c:s[2],a:a.id,t:s[3].map(function(x){var p=x.split('|');return{n:p[0],k:p[1]}})})})});
var DW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],YS=[2025,2024,2023,2022,2021,2020];
var RS={ok:'✅ Acertei',err:'❌ Errei',gu:'🎲 Chutei'};
var KEY='enemflow-v1',st={};
try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
st=Object.assign({p:null,pr:{},tasks:[],done:{},tp:{},qs:[],lk:{}},st);
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var v='hoje',now=new Date(),cal={y:now.getFullYear(),m:now.getMonth(),sel:dk(now)},op={},qf={y:0,r:'all'},tmpDays=null;
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sub(id){return S.filter(function(s){return s.id===id})[0]}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tag(s){return '<span class="tag" style="--c:'+s.c+'">'+esc(s.n)+'</span>'}
function theme(){var t=st.p&&st.p.theme;if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function xpv(){var n=0;Object.keys(st.done).forEach(function(k){if(st.done[k])n+=10});Object.keys(st.tp).forEach(function(k){if(st.tp[k])n+=15});st.qs.forEach(function(q){n+=q.r==='ok'?8:3});st.tasks.forEach(function(t){if(t.done)n+=5});return n}
function plan(){var p=st.p,seq=[],out={};for(var r=0;r<3;r++)S.forEach(function(s){if((st.pr[s.id]||2)>r)seq.push(s.id)});
 p.days.slice().sort().forEach(function(d,k){out[d]=[];for(var i=0;i<p.hours;i++)out[d].push(seq[(k*p.hours+i)%seq.length])});return out}
function blocks(date){var d=new Date(date+'T00:00'),b=plan()[d.getDay()]||[];return b.map(function(id,i){return{id:id,key:date+'|'+i,done:!!st.done[date+'|'+i]}})}
function blockRow(b){var s=sub(b.id);return '<label class="row'+(b.done?' d':'')+'" style="--c:'+s.c+';font-weight:400;margin:0"><input type="checkbox" data-a="blk" data-k="'+b.key+'"'+(b.done?' checked':'')+'><span class="t">Bloco de 1h</span> '+tag(s)+'</label>'}
function taskRow(t){var s=t.s?sub(t.s):null;return '<label class="row'+(t.done?' d':'')+'" style="--c:'+(s?s.c:'#7C4DFF')+';font-weight:400;margin:0"><input type="checkbox" data-a="tsk" data-k="'+t.id+'"'+(t.done?' checked':'')+'><span class="t">'+esc(t.title)+'</span> '+(s?tag(s):'')+' <button class="chip" data-a="del" data-k="'+t.id+'" style="margin-left:auto">✕</button></label>'}
function addForm(date){return '<div class="row" style="flex-wrap:wrap"><input id="nt" placeholder="Nova tarefa ou evento…" style="flex:1;min-width:140px"><select id="ns"><option value="">Geral</option>'+S.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('')+'</select><button class="btn" data-a="add" data-k="'+date+'">Adicionar</button></div>'}
function qstats(){var t=st.qs.length,ok=st.qs.filter(function(q){return q.r==='ok'}).length,er={};st.qs.forEach(function(q){if(q.r!=='ok')er[q.s]=(er[q.s]||0)+1});
 var w=Object.keys(er).sort(function(a,b){return er[b]-er[a]})[0];return{t:t,ok:ok,pc:t?Math.round(ok/t*100):0,w:w,wn:er[w]}}
function vHoje(){
 var p=st.p,k=dk(new Date()),b=blocks(k),tk=st.tasks.filter(function(t){return t.date===k}),q=qstats();
 var days=Math.max(0,Math.ceil((new Date(p.exam+'T00:00')-new Date())/864e5));
 var tot=0,dn=0;S.forEach(function(s){s.t.forEach(function(t,i){tot++;if(st.tp[s.id+'|'+i])dn++})});
 var pc=Math.round(dn/tot*100),bd=b.filter(function(x){return x.done}).length;
 var foco=q.w?'<div class="card bar" style="--c:'+sub(q.w).c+'"><h3>🎯 Foco sugerido</h3><p class="mu" style="margin:4px 0 0">Você tem '+q.wn+' questão(ões) para revisar em '+esc(sub(q.w).n)+'. Que tal um bloco extra hoje?</p></div>':'';
 return '<div><h2>Olá, '+esc(p.name)+' 👋</h2><div class="mu">'+DW[new Date().getDay()]+', '+new Date().getDate()+' de '+MS[new Date().getMonth()].toLowerCase()+'</div></div>'+
 '<div class="grid"><div class="card stat" style="--c:#7C4DFF"><div class="mu">⏳ Dias para o ENEM</div><div class="big">'+days+'</div></div>'+
 '<div class="card stat" style="--c:#00C2A8"><div class="mu">🎯 Conteúdos BNCC</div><div class="big">'+pc+'%</div><div class="prog"><i style="--c:#00C2A8;width:'+pc+'%"></i></div></div>'+
 '<div class="card stat" style="--c:#FF8A00"><div class="mu">📆 Blocos de hoje</div><div class="big">'+bd+'/'+b.length+'</div></div>'+
 '<div class="card stat" style="--c:#00A3FF"><div class="mu">📝 Questões feitas</div><div class="big">'+q.t+'<span class="mu"> · '+q.pc+'% ✅</span></div></div></div>'+foco+
 '<div class="card"><h3>Hoje</h3>'+(b.length?b.map(blockRow).join(''):'<p class="mu">Dia livre no cronograma 🎉</p>')+tk.map(taskRow).join('')+addForm(k)+'</div>'}
function vCrono(){
 var pl=plan(),p=st.p;
 var cols=[1,2,3,4,5,6,0].map(function(d){return '<div class="card" style="padding:9px;margin:0"><b>'+DW[d]+'</b><div style="margin-top:6px">'+((pl[d]||[]).map(function(id){return tag(sub(id))}).join('')||'<span class="mu">Livre 😴</span>')+'</div></div>'}).join('');
 var pr=S.map(function(s){var n=st.pr[s.id]||2;return '<div class="row" style="--c:'+s.c+'">'+tag(s)+'<button class="chip" data-a="pr" data-k="'+s.id+'" style="margin-left:auto">'+['','🟢 Baixa','🟡 Média','🔴 Alta'][n]+'</button></div>'}).join('');
 return '<div><h2>Cronograma semanal</h2><p class="mu">Gerado a partir das suas '+p.hours+'h/dia e das prioridades abaixo.</p></div><div class="wk">'+cols+'</div>'+
 '<div class="card" style="margin-top:12px"><h3>Prioridades por disciplina</h3><p class="mu">Toque para alternar. O cronograma se ajusta sozinho.</p>'+pr+'</div>'}
function vAgenda(){
 var f=new Date(cal.y,cal.m,1),n=new Date(cal.y,cal.m+1,0).getDate(),h='',td=dk(new Date());
 DW.forEach(function(d){h+='<b>'+d+'</b>'});
 for(var i=0;i<f.getDay();i++)h+='<div></div>';
 for(var d=1;d<=n;d++){var k=cal.y+'-'+String(cal.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  var ts=st.tasks.filter(function(t){return t.date===k}),bl=blocks(k);
  h+='<div class="c'+(k===td?' t':'')+(k===cal.sel?' s':'')+'" data-a="sel" data-k="'+k+'">'+d+'<div class="dots">'+bl.map(function(x){return '<i style="--c:'+sub(x.id).c+';opacity:.45"></i>'}).join('')+ts.map(function(t){return '<i style="--c:'+(t.s?sub(t.s).c:'#7C4DFF')+'"></i>'}).join('')+'</div></div>'}
 var sd=new Date(cal.sel+'T00:00'),sb=blocks(cal.sel),stk=st.tasks.filter(function(t){return t.date===cal.sel});
 return '<h2>Agenda</h2><div class="row"><button class="chip" data-a="mo" data-k="-1">‹</button><b>'+MS[cal.m]+' '+cal.y+'</b><button class="chip" data-a="mo" data-k="1">›</button></div><div class="cal">'+h+'</div>'+
 '<div class="card" style="margin-top:12px"><h3>'+DW[sd.getDay()]+', '+sd.getDate()+' de '+MS[sd.getMonth()].toLowerCase()+'</h3>'+sb.map(blockRow).join('')+stk.map(taskRow).join('')+addForm(cal.sel)+'</div>'}
function mat(s,t){var yt='https://www.youtube.com/results?search_query=',q=t.n+' '+s.n;
 return [['▶️ Videoaula',yt+encodeURIComponent('aula ENEM '+q)],['⚡ Resumo rápido',yt+encodeURIComponent('resumo ENEM '+q)],['✍️ Questões resolvidas',yt+encodeURIComponent('questões ENEM resolvidas '+q)],['📄 Material (PDF)','https://www.google.com/search?q='+encodeURIComponent(q+' ENEM material didático resumo pdf')]]}
function vConteudo(){
 return '<div><h2>Conteúdos por área da BNCC</h2><p class="mu">Cada tópico mostra a competência específica da BNCC (C1…). Toque em 📚 para abrir videoaulas e materiais. Confira os códigos de habilidades no documento oficial do MEC.</p></div>'+A.map(function(a){
  return '<div><h3 style="margin:16px 0 2px;color:'+a.c+'">'+esc(a.n)+'</h3><div class="mu" style="margin-bottom:8px">'+esc(a.d)+'</div><div class="grid">'+a.s.map(function(id){var s=sub(id[0]),dn=0;
   var rows=s.t.map(function(t,i){var k=s.id+'|'+i,on=!!st.tp[k];if(on)dn++;var o=op[k],cl=st.lk[k]||[];
    var ex=o?'<div class="lk">'+mat(s,t).map(function(m){return '<a class="chip" target="_blank" rel="noopener" href="'+esc(m[1])+'">'+m[0]+'</a>'}).join('')+cl.map(function(l,j){return '<span class="chip" style="--c:'+s.c+'"><a target="_blank" rel="noopener" style="color:inherit;text-decoration:none" href="'+esc(l.u)+'">🔗 '+esc(l.t)+'</a> <span data-a="dlk" data-k="'+k+'|'+j+'" style="cursor:pointer">✕</span></span>'}).join('')+'</div><div class="row" style="flex-wrap:wrap"><input id="lt'+i+'" placeholder="Título" style="width:100px"><input id="lu'+i+'" placeholder="Cole um link https://…" style="flex:1;min-width:120px"><button class="chip" data-a="alk" data-k="'+k+'" data-i="'+i+'">+ Salvar</button></div>':'';
    return '<label class="row'+(on?' d':'')+'" style="--c:'+s.c+';font-weight:400;margin:0"><input type="checkbox" data-a="tp" data-k="'+k+'"'+(on?' checked':'')+'><span class="t">'+esc(t.n)+'</span><span class="mu" style="margin-left:auto">C'+t.k+'</span><button class="chip" data-a="op" data-k="'+k+'">📚</button></label>'+ex}).join('');
   return '<div class="card bar" style="--c:'+s.c+';margin:0">'+tag(s)+'<div class="prog"><i style="--c:'+s.c+';width:'+Math.round(dn/s.t.length*100)+'%"></i></div>'+rows+'</div>'}).join('')+'</div></div>'}).join('')}
function vQuest(){
 var q=qstats(),sy=qf.y||YS[0],L=st.qs.filter(function(x){return(!qf.y||x.y===qf.y)&&(qf.r==='all'||(qf.r==='err'&&x.r!=='ok')||(qf.r==='rev'&&x.rev))}).slice().reverse();
 var ar=A.map(function(a){var l=st.qs.filter(function(x){return sub(x.s).a===a.id}),o=l.filter(function(x){return x.r==='ok'}).length,pc=l.length?Math.round(o/l.length*100):0;return '<div class="row"><span style="width:92px" class="mu">'+esc(a.n.split(' ')[0])+'</span><div class="prog" style="flex:1"><i style="--c:'+a.c+';width:'+pc+'%"></i></div><b style="width:42px;text-align:right">'+pc+'%</b></div>'}).join('');

['52','his','Guerras mundiais e Guerra Fria',2,'Resumo do texto: a pandemia do começo do século XX ficou conhecida como gripe espanhola, embora o vírus não tenha se originado na Espanha. Uma hipótese é que a Espanha, neutra na Primeira Guerra, tinha mais liberdade de imprensa que os países em conflito. A denominação foi determinada pelo(a):',['precariedade dos conhecimentos da medicina militar','retaliação da Tríplice Aliança aos soldados desertores','controle dos relatos oriundos de campos de batalha','emprego de armas biológicas em confrontos transnacionais','circulação de refugiados contaminados em áreas conflagradas'],2],
['56','geo','Meio ambiente e clima',2,'Resumo do texto: o Rio Reno foi por séculos uma rota de navegação confiável, base de gigantes fabris, mas o nível da água tem diminuído e impede a navegação do final do verão ao outono, efeito da crise climática. Qual o efeito econômico do problema ambiental?',['Supressão da extração de minério','Intensificação da atividade de pesca','Encarecimento da logística de transporte','Inviabilização da agricultura de subsistência','Sucateamento da indústria de transformação'],2],
['58','his','República brasileira',3,'Resumo do texto: em 1872 havia mais de 1 milhão de votantes (13% da população livre); em 1886, pouco mais de 100 mil (0,8%), um corte de quase 90% do eleitorado, contra a tendência europeia de ampliar direitos políticos. A Proclamação da República não mudou o quadro. A queda após a Reforma de 1881 se explica pela:',['restrição de gênero','exclusão de imigrantes','comprovação de domicílio','exigência da alfabetização','obrigatoriedade do sufrágio'],3],
['66','fil','Trabalho e sociedade',3,'Resumo do texto (Marcuse): na sociedade industrial avançada, independência de pensamento, autonomia e direito à oposição política perdem sua função crítica, pois o sistema atende às necessidades dos indivíduos e torna o não conformismo socialmente inútil. Qual característica dessa sociedade é apresentada?',['Gestão integrada','Relativismo moral','Desobediência civil','Realidade unidimensional','Desenvolvimento tecnológico'],3],
['75','geo','Meio ambiente e clima',2,'Resumo do texto: a partir do século XIX, e principalmente no século XX, começou o uso de produtos sintéticos na agricultura; no Brasil, os inseticidas ampliaram sua fatia entre os defensivos a partir dos anos 1960 e 1970. Nos espaços agrícolas, essa mudança técnica provocou a diminuição da:',['desagregação de camadas pedológicas','diversidade de polinizadores naturais','contaminação de lençóis freáticos','produtividade da terra cultivada','ocorrência da erosão laminar'],1],
['78','his','Brasil Colônia e Império',2,'Resumo do texto: a Roda dos Expostos de Salvador (1726) acolhia recém-nascidos abandonados, com práticas caritativas e paternalistas voltadas ao cuidado básico e, especialmente, à salvação da alma da criança, pelo batismo, devido à alta mortalidade. A instituição se justificava pelo(a):',['defesa de direitos humanos','preceito de natureza sociorreligiosa','reconhecimento de vínculos familiares','discurso de cunho técnico-científico','ideologia de caráter abolicionista'],1],
['80','geo','Urbanização e demografia',1,'Resumo do texto: cidade sustentável é a que une prudência ecológica, eficiência energética e equidade socioespacial, numa relação sinérgica com a natureza (não de natureza-objeto). Qual medida pública contradiz esse modelo?',['coleta seletiva de lixo','reutilização das águas pluviais','canalização dos cursos hídricos','arborização das avenidas centrais','educação ambiental da comunidade'],2],
['6','port','Gêneros textuais',1,'Resumo do texto: em crônica sobre escrever de próprio punho na era digital, a autora conta que sua letra hoje aparece sobretudo em bilhetes: na porta da geladeira, para os coabitantes, e em post-its na mesa do escritório, para si mesma, como lembretes de tarefas logo descartados. No que diz respeito ao gênero bilhete, a autora:',['ressalta a formalidade na comunicação com as pessoas de sua convivência','critica a ansiedade causada pela velocidade da comunicação','expressa a obrigatoriedade de concisão nas anotações','questiona a prática da escrita de próprio punho','apresenta a diversidade de usos no cotidiano'],4],
['7','port','Gêneros textuais',2,'Resumo do texto: crônica em primeira pessoa sobre a escrita à mão e as tecnologias de escrita, construída a partir de experiências pessoais da autora, que conclui que o que existe é o punho e o pixel, e não um contra o outro. O elemento que caracteriza esse texto como uma crônica é a:',['defesa das opiniões da autora sobre um tema de interesse coletivo','exposição sobre o uso de tecnologias nas práticas de escrita atuais','abordagem de fatos do contexto pessoal em uma perspectiva reflexiva','utilização de recursos linguísticos para a interlocução direta com o leitor','apresentação de acontecimentos segundo a ordem de sucessão no tempo'],2],
['9','port','Interpretação de texto',3,'Mesma crônica sobre escrita à mão e digital: a autora cita bilhetes, post-its e documentos que hoje são quase todos digitais, e diz que não adianta pensar como se tudo fosse excludente. A autora conclui que as novas tecnologias de escrita:',['evoluem para facilitar a vida cotidiana','alcançam diferentes realidades sociais','coexistem com outras já estabelecidas','promovem maior agilidade na comunicação','surgem nos contextos em que são necessárias'],2],
['12','port','Interpretação de texto',1,'Resumo do texto: em 2024, o Ministério do Esporte lançou o programa Maré Inclusiva, que amplia as oportunidades de prática do surf (parasurf) para pessoas com deficiência e, segundo a Secretaria Nacional do Paradesporto, busca transformar vidas e promover inclusão e respeito. De acordo com o texto, o programa evidencia a:',['adesão de diferentes países a programas inclusivos','preocupação política em atender a demandas paralímpicas','importância de uma política pública esportiva para a inclusão','eficiência das iniciativas de inclusão em megaeventos esportivos','escassez de investimento em práticas corporais de aventura na natureza'],2],
['13','port','Variação linguística',2,'Resumo do texto: artigo da Lei n. 10.639/2003 que torna obrigatório, nos ensinos fundamental e médio, oficiais e particulares, o estudo de História e Cultura Afro-Brasileira, ministrado em todo o currículo escolar. O emprego da norma-padrão é justificado nesse texto:',['pela especialização de seu público-alvo','pela relevância cultural de seu conteúdo','pelos contextos pedagógicos em que circula','pela importância para os grupos étnico-raciais','pelas características do gênero a que pertence'],4],
['19','port','Interpretação de texto',1,'Resumo do texto: nos Jogos Olímpicos de 2024, atletas brasileiras como Beatriz Souza, Rebeca Andrade, Rayssa Leal e a seleção feminina de futebol destacaram a importância da saúde mental e do apoio psicológico. Nesse texto, as atletas brasileiras defendem o(a):',['investimento na modernização de equipamentos','subordinação do treinamento físico ao mental','estímulo à competição entre adversárias','aprimoramento da expressão corporal','importância da saúde emocional'],4],
['24','port','Gêneros textuais',2,'Cartaz do Unicef: fotos de duas crianças, uma indígena e uma negra, com frases que projetam o futuro delas (um médico aos 36 anos, uma advogada aos 29) e o slogan sobre enxergar a igualdade em um mundo de diferenças, seguido de dados sobre a discriminação racial na infância. Nesse cartaz, as frases que projetam a vida profissional das crianças têm como objetivo:',['sugerir a arrecadação de fundos para o sustento de povos originários no país','sensibilizar a sociedade sobre os benefícios decorrentes do combate ao racismo','indicar a importância da orientação vocacional na educação de crianças no Brasil','chamar a atenção sobre a necessidade de ações voltadas para a educação infantil','valorizar o trabalho de agências internacionais na luta contra a discriminação racial'],1],
['25','port','Interpretação de texto',2,'Resumo do texto: texto bem-humorado em primeira pessoa que enfileira expressões e jargões da moda em 2023 para criticar a exposição constante a frases feitas e automatizadas, concluindo que a língua é assim mesmo. Nesse texto, a estratégia empregada para criticar essa exposição é o(a):',['menção feita à efemeridade de alguns usos linguísticos aleatórios','subjetividade marcada pela reflexão que se desenvolve em primeira pessoa','efeito estilístico da repetição intencional da palavra assim no último parágrafo','sedução sugerida pelo envolvimento direto do leitor marcado nos usos de você e sua','humor gerado pelo uso das estruturas linguísticas que são objeto da reflexão desenvolvida'],4],
['26','port','Variação linguística',1,'Texto de revista sobre a canjica e o curau: o mesmo doce de milho recebe nomes diferentes conforme a região (o que no norte é canjica, no sul é curau, e vice-versa), além de vários outros nomes pelo país. Esse texto, que apresenta um prato da culinária brasileira, evidencia:',['valor afetivo nas nomenclaturas','variedade linguística entre regiões','disputa regional pelo melhor prato','modos de preparo de um mesmo alimento','paladares diversificados entre diferentes estados'],1],
['27','port','Interpretação de texto',1,'Resumo do texto: o autor distingue briga e luta. A briga desumaniza o outro e pode até matá-lo; na luta, o outro é considerado em sua proposta combativa e em suas habilidades, e o desenvolvimento passa por lidar com agressividade, raiva, frustração e orgulho, num combate também contra as próprias limitações. O texto apresenta as diferenças entre briga e luta na medida em que aponta o(a):',['superação pessoal na luta','violência evidenciada na luta','predomínio de regras na briga','desafio externo presente na luta','habilidade desenvolvida na briga'],0],
['36','port','Variação linguística',3,'Trecho de fala transcrita: uma pessoa conta o enredo de um filme a que assistiu, encadeando quase todas as ações com a palavra daí, entre pausas e reformulações. Nesse texto, a repetição da forma daí revela:',['a necessidade de adequação ao interlocutor','a origem regional do locutor','a escolaridade do falante','uma estratégia presente na linguagem oral','uma ênfase em determinadas partes do discurso'],3],
['39','port','Interpretação de texto',1,'Resumo do texto: o rádio se difundiu no Brasil nas décadas de 1920 e 1930, sobreviveu à chegada da TV porque o sinal desta não cobria todos os lugares e, com a internet e os celulares, foi incorporado à web rádio e ao podcast; um pesquisador diz que o podcast é uma evolução natural do rádio. Ao abordar a trajetória dos meios de comunicação, o texto propõe uma reflexão sobre a:',['tecnologia digital e seus desdobramentos no desenvolvimento da televisão','evolução da tecnologia digital com o predomínio do podcast sobre o rádio','permanência do rádio e sua evolução por meio da tecnologia digital','influência da televisão sobre os programas de radiojornalismo','interferência da tecnologia digital nas interações humanas'],2],
['43','port','Gêneros textuais',2,'Resumo da reportagem: em 1995, os Jenipapo-Kanindé quebraram a tradição de sucessão masculina e nomearam uma mulher, a Cacique Pequena, como líder; ela lutou pelo reconhecimento do povo pela Funai e, mais tarde, a família decidiu que suas filhas a sucederão. Ao abordar a realidade da etnia, a reportagem cumpre uma função social quando destaca o(a):',['quantidade de famílias indígenas em Aquiraz','força da tradição nas comunidades indígenas','estudo sobre a demarcação das terras indígenas','protagonismo feminino na linha sucessória desse povo','reconhecimento dessa comunidade pelo governo brasileiro'],3],
['44','port','Funções da linguagem',2,'Resumo do texto: artigo que defende a leitura para crianças como ato de amor e lista quatro motivos numerados: cria laço emocional, ajuda no desenvolvimento cognitivo, ensina sobre o mundo e incentiva a imaginação. Para persuadir o interlocutor sobre a importância de ler para as crianças, o texto recorre à estratégia de:',['propor uma condição aos pais, pelo emprego da conjunção se','relativizar a opinião apresentada pelo autor, com o uso de Parece que','empregar uma linguagem metafórica, com o uso da expressão laço de amorosidade','enumerar razões pertinentes a esse ato, como no exemplo ensina sobre o mundo','implicar o autor do texto como corresponsável pela campanha, pelo uso de é nossa função'],3],
['16','lit','Escolas literárias',2,'Poema (p. 9 do caderno 1 azul, texto não reproduzido aqui): soneto de G. Machado em que o eu lírico compara a si e ao outro ao mar violento e à rocha imóvel, transformando a relação amorosa em imagem da natureza. Nesse soneto, os traços da estética simbolista são resgatados pelo eu lírico ao:',['rejeitar as emoções de amor e mágoa','expressar a dubiedade do olhar sobre o outro','representar o eu e o tu como sujeitos volúteis','associar a sua inconsciência a elementos da natureza','metaforizar o conflito amoroso nas imagens de mar e rocha'],4],
['28','lit','Escolas literárias',1,'Poema (p. 13 do caderno 1 azul, texto não reproduzido aqui): em Pequenino morto, de V. de Carvalho, o eu lírico acompanha o cortejo de uma criança morta e pede que ela acorde, descrevendo o caminho triste até as covas. Nesse fragmento, o sentimento de luto adquire contornos expressivos e é intensificado pela:',['descrição da paisagem de um cemitério','recusa do eu lírico à irreversibilidade da morte','sonoridade dos versos produzida pela pontuação','religiosidade evocada como forma de fortalecimento','impressão de sonho na construção da estrutura poética'],1],
['51','fil','Cultura e desigualdade',1,'Letra de canção (p. 23 do caderno 1 azul, letra não reproduzida aqui): em Sinal fechado, de Paulinho da Viola, dois conhecidos se encontram no trânsito, trocam cumprimentos apressados e prometem se ligar e se ver, mas a pressa e o sinal que abre os impedem de conversar. A letra apresenta a permanência de uma situação da vida cotidiana ao destacar a:',['diminuição do comportamento competitivo','importância da memória coletiva','redução da mobilidade urbana','efemeridade dos vínculos de afetividade','obsolescência dos meios de comunicação'],3]
